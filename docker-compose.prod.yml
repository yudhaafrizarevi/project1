services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: kanban_app_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-network
      - backend-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: kanban_frontend_prod
    restart: unless-stopped
    networks:
      - frontend-network

  nginx:
    image: nginx:alpine
    container_name: kanban_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/production/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - frontend
    networks:
      - frontend-network

  db:
    image: mysql:8.0
    container_name: kanban_db_prod
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - kanban_db_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend-network

networks:
  frontend-network:
  backend-network:
    internal: true

volumes:
  kanban_db_prod_data:
